<!DOCTYPE html>
<html lang="zh-CN">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
		 />
		<title>合成大西瓜-修复点击即失败版</title>
		<style>
			*{margin:0;padding:0;box-sizing:border-box}
			body{background:#f8e9c8;font-family:system-ui,-apple-system,BlinkMacSystemFont,sans-serif}
			#wrap{max-width:420px;margin:12px auto;position:relative}
			#gameCanvas{width:100%;background:#fff8e8;border:2px solid #965a2f;border-radius:12px;display:block}
			#scoreBar{display:flex;justify-content:space-between;padding:6px 10px;font-size:18px;font-weight:bold;color:#6b4423}
			/* 开始界面 */
			#startScreen{position:absolute;inset:0;background:#fffdf7;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;border-radius:12px}
			#startScreen h1{font-size:26px;margin-bottom:12px;color:#d85030}
			.fruitTable{font-size:14px;margin:14px 0;line-height:1.6;background:#fff;padding:10px;border-radius:8px;border:1px solid #ddd}
			#startBtn{padding:12px 32px;font-size:20px;border:none;background:#ff7847;color:#fff;border-radius:10px;margin-top:10px}
			#modal{position:absolute;inset:0;background:rgba(0,0,0,0.65);display:none;align-items:center;justify-content:center;z-index:99}
			.box{background:#fff;padding:24px 28px;border-radius:16px;text-align:center;min-width:260px}
			.box h2{margin-bottom:10px}
			.box p{margin:6px 0;font-size:17px}
			#restartBtn{margin-top:14px;padding:8px 22px;font-size:17px;border:none;background:#ff7847;color:#fff;border-radius:8px}
		</style>
	</head>
	<body>
		<div id="wrap">
			<div id="scoreBar">
				<div>得分：<span id="score">0</span></div>
				<div>最高分：<span id="high">0</span></div>
			</div>
			<canvas id="gameCanvas"></canvas>
			<!-- 开局开始界面 -->
			<div id="startScreen">
				<h1>🍉合成大西瓜</h1>
				<div class="fruitTable">
					<div>【官方合成顺序&得分】</div>
					<div>
						1🍒樱桃(1分) → 2🍓草莓(2分) → 3🍇葡萄(4分) →
						4🍊橙子(8分)
					</div>
					<div>
						5🍎苹果(16分) → 6🍐梨(32分) → 7🍍菠萝(64分) →
						8🍈哈密瓜(128分) → 9🍉西瓜(256分)
					</div>
					<div style="margin-top:8px;font-size:13px;color:#c0392b">
						⚠️仅可投放：樱桃/草莓/葡萄/橙子；苹果及以上只能合成产出
					</div>
					<div style="font-size:13px;color:#666">
						每累计投放10个当前水果，解锁下一级可投放水果
					</div>
				</div>
				<button id="startBtn">开始游戏</button>
			</div>
			<!-- 结算弹窗 -->
			<div id="modal">
				<div class="box">
					<h2 id="title">游戏结束</h2>
					<p>本局分数：<span id="finalScore">0</span></p>
					<p>历史最高：<span id="finalHigh">0</span></p>
					<button id="restartBtn">再来一次</button>
				</div>
			</div>
		</div>
		<script>
			// ====================== 音效工具函数（无外部音频，兼容iPad Safari） ======================
			let audioCtx = null;
			// 初始化音频上下文（用户点击后激活，浏览器策略限制）
			function initAudio(){
			    if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
			}
			// 通用播放音效
			function playTone(freq, duration, type='sine', volume=0.2){
			    if(!audioCtx) return;
			    const osc = audioCtx.createOscillator();
			    const gain = audioCtx.createGain();
			    osc.type = type;
			    osc.frequency.value = freq;
			    gain.gain.setValueAtTime(volume, audioCtx.currentTime);
			    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
			    osc.connect(gain);
			    gain.connect(audioCtx.destination);
			    osc.start();
			    osc.stop(audioCtx.currentTime + duration);
			}
			// 1.投放水果音效
			function soundDrop(){ playTone(380,0.08,'triangle',0.18); }
			// 2.合成水果音效
			function soundMerge(){ playTone(520,0.12,'sine',0.22); setTimeout(()=>playTone(680,0.12,'sine',0.16),80); }
			// 3.通关西瓜音效
			function soundWin(){
			    playTone(440,0.15);
			    setTimeout(()=>playTone(550,0.15),120);
			    setTimeout(()=>playTone(660,0.25),240);
			}
			// 4.游戏失败音效
			function soundLose(){ playTone(160,0.3,'saw',0.2); }
			// 5.按钮点击音效
			function soundClick(){ playTone(720,0.06,'square',0.12); }
			// ====================== 水果配置（严格匹配需求文档） ======================
			const FRUIT_LIST = [
			  {r:16,score:1,emoji:"🍒"}, //Lv1 樱桃
			  {r:22,score:2,emoji:"🍓"}, //Lv2 草莓
			  {r:28,score:4,emoji:"🍇"}, //Lv3 葡萄
			  {r:34,score:8,emoji:"🍊"}, //Lv4 橙子
			  {r:40,score:16,emoji:"🍎"},//Lv5 苹果
			  {r:46,score:32,emoji:"🍐"},//Lv6 梨
			  {r:54,score:64,emoji:"🍍"},//Lv7 菠萝
			  {r:62,score:128,emoji:"🍈"},//Lv8 哈密瓜
			  {r:72,score:256,emoji:"🍉"}//Lv9 西瓜
			];
			const MAX_LEVEL = FRUIT_LIST.length - 1;
			const FAIL_LINE_Y = 85;
			const UNLOCK_COUNT = 10;
			const MAX_DROP_LEVEL = 3;//仅可投放0~3级（樱桃/草莓/葡萄/橙子）
			function drawFruit(ctx,x,y,lv){
			  const item=FRUIT_LIST[lv];
			  ctx.save();
			  ctx.font = `${item.r*1.7}px sans-serif`;
			  ctx.textAlign="center";
			  ctx.textBaseline="middle";
			  ctx.fillText(item.emoji,x,y);
			  ctx.restore();
			}
			const canvas=document.getElementById("gameCanvas");
			const ctx=canvas.getContext("2d");
			const scoreDom=document.getElementById("score");
			const highDom=document.getElementById("high");
			const modal=document.getElementById("modal");
			const titleDom=document.getElementById("title");
			const finalScoreDom=document.getElementById("finalScore");
			const finalHighDom=document.getElementById("finalHigh");
			const restartBtn=document.getElementById("restartBtn");
			const startScreen=document.getElementById("startScreen");
			const startBtn=document.getElementById("startBtn");
			const W=380,H=620;
			canvas.width=W;canvas.height=H;
			let balls=[];
			let score=0;
			let highScore=+localStorage.getItem("watermelon_high")||0;
			let nextLv=0;
			let dropReady=true;
			let gameOver=false;
			let gameStarted=false;
			let dropCounter = new Array(FRUIT_LIST.length).fill(0);
			let maxUnlockedLv = 0;
			highDom.textContent=highScore;
			// 水果对象：新增保护计时器标记
			function createBall(x,y,lv){
			  const r=FRUIT_LIST[lv].r;
			  return {
			    x,y,vx:0,vy:0,r,lv,
			    ignoreFail:true, // 保护期不检测越线
			    overLineTime:0   // 持续越线计时
			  };
			}
			// 保护期结束，开启越线检测
			function enableBallFailCheck(ball){
			  ball.ignoreFail = false;
			}
			function updateUnlock(){
			  for(let i=0;i<FRUIT_LIST.length-1;i++){
			    if(dropCounter[i] >= UNLOCK_COUNT){
			      maxUnlockedLv = i+1;
			    }
			  }
			  if(maxUnlockedLv > MAX_DROP_LEVEL) maxUnlockedLv = MAX_DROP_LEVEL;
			}
			function spawnPreview(){
			  updateUnlock();
			  nextLv = Math.floor(Math.random()*(maxUnlockedLv+1));
			}
			function physicsStep(){
			  const g=0.26;
			  const bounce=0.22;
			  // 重力与边界碰撞
			  for(let b of balls){
			    b.vy+=g;
			    b.x+=b.vx; b.y+=b.vy;
			    if(b.x-b.r<0){b.x=b.r;b.vx*=-bounce;}
			    if(b.x+b.r>W){b.x=W-b.r;b.vx*=-bounce;}
			    if(b.y+b.r>H){b.y=H-b.r;b.vy*=-bounce;b.vy*=0.85;}
			  }
			  // 水果碰撞+合成逻辑
			  for(let i=0;i<balls.length;i++){
			    for(let j=i+1;j<balls.length;j++){
			      const a=balls[i],b=balls[j];
			      const dx=b.x-a.x;
			      const dy=b.y-a.y;
			      const dist=Math.hypot(dx,dy);
			      const minD=a.r+b.r;
			      if(dist<minD){
			        // 相同水果合成
			        if(a.lv===b.lv){
			          soundMerge();
			          const midX=(a.x+b.x)/2;
			          const midY=(a.y+b.y)/2;
			          const newLv=a.lv+1;
			          if(a.lv===MAX_LEVEL){
			            setEnd(true);
			            return;
			          }
			          score+=FRUIT_LIST[newLv].score;
			          scoreDom.textContent=score;
			          balls.splice(j,1);
			          balls.splice(i,1);
			          const newBall = createBall(midX,midY,newLv);
			          newBall.ignoreFail = false; // 合成出来的水果无保护期
			          balls.push(newBall);
			          return;
			        }
			        // 不同水果物理分离
			        const overlap=minD-dist;
			        const nx=dx/dist,ny=dy/dist;
			        a.x-=nx*overlap*0.5;
			        b.x+=nx*overlap*0.5;
			        a.y-=ny*overlap*0.5;
			        b.y+=ny*overlap*0.5;
			        const vx=a.vx-b.vx;
			        const vy=a.vy-b.vy;
			        const vn=vx*nx+vy*ny;
			        if(vn>0) continue;
			        const impulse=-(1+bounce)*vn/2;
			        a.vx+=impulse*nx;a.vy+=impulse*ny;
			        b.vx-=impulse*nx;b.vy-=impulse*ny;
			      }
			    }
			  }
			  // ========== 优化越线判定（核心修复） ==========
			  let triggerLose = false;
			  const OVER_LINE_THRESHOLD = 25; // 持续越线25帧才失败
			  for(let b of balls){
			    if(b.ignoreFail) continue;
			    // 水果顶部越过警戒线
			    const isOverLine = (b.y - b.r) < FAIL_LINE_Y;
			    if(isOverLine){
			      b.overLineTime += 1;
			      if(b.overLineTime >= OVER_LINE_THRESHOLD){
			        triggerLose = true;
			        break;
			      }
			    }else{
			      b.overLineTime = 0; // 落回线下重置计时
			    }
			  }
			  if(triggerLose){
			    setEnd(false);
			  }
			}
			function setEnd(isWin){
			  if(gameOver) return;
			  gameOver=true;
			  if(isWin) soundWin();
			  else soundLose();
			  if(score>highScore){
			    highScore=score;
			    localStorage.setItem("watermelon_high",highScore);
			  }
			  titleDom.innerText=isWin?"🎉恭喜通关！合成西瓜！":"💥游戏结束，水果越线";
			  finalScoreDom.innerText=score;
			  finalHighDom.innerText=highScore;
			  modal.style.display="flex";
			}
			function resetGame(){
			  balls=[];score=0;gameOver=false;dropReady=true;
			  dropCounter.fill(0);
			  maxUnlockedLv=0;
			  scoreDom.textContent=0;highDom.textContent=highScore;
			  modal.style.display="none";
			  spawnPreview();
			}
			function dropBall(tx){
			  if(!gameStarted || !dropReady||gameOver) return;
			  dropReady=false;
			  soundDrop();
			  const safeX=Math.max(FRUIT_LIST[nextLv].r,Math.min(W-FRUIT_LIST[nextLv].r,tx));
			  const newBall = createBall(safeX,30,nextLv);
			  balls.push(newBall);
			  dropCounter[nextLv] += 1;
			  updateUnlock();
			  // 投放水果保护期450毫秒，期间不检测越线失败
			  setTimeout(()=> enableBallFailCheck(newBall),450);
			  setTimeout(()=>{dropReady=true;spawnPreview();},350);
			}
			canvas.addEventListener("pointerdown",e=>{
			  initAudio();
			  const rect=canvas.getBoundingClientRect();
			  const px=(e.clientX-rect.left)/rect.width*W;
			  dropBall(px);
			});
			// 开始游戏按钮
			startBtn.onclick = function(){
			  initAudio();
			  soundClick();
			  startScreen.style.display="none";
			  gameStarted=true;
			  resetGame();
			};
			// 再来一次按钮
			restartBtn.onclick=function(){
			  initAudio();
			  soundClick();
			  resetGame();
			};
			function loop(){
			  ctx.clearRect(0,0,W,H);
			  //绘制红色虚线失败警戒线
			  ctx.save();
			  ctx.strokeStyle="#ff3333";
			  ctx.lineWidth=2;
			  ctx.setLineDash([8,6]);
			  ctx.beginPath();
			  ctx.moveTo(0,FAIL_LINE_Y);
			  ctx.lineTo(W,FAIL_LINE_Y);
			  ctx.stroke();
			  ctx.fillStyle="#ff3333";
			  ctx.font="14px sans-serif";
			  ctx.fillText("失败警戒线",10,FAIL_LINE_Y-6);
			  ctx.restore();
			  if(gameStarted && !gameOver) physicsStep();
			  // 绘制所有水果
			  for(let b of balls){
			    drawFruit(ctx,b.x,b.y,b.lv);
			  }
			  // 预览下一个水果
			  if(gameStarted && !gameOver && dropReady){
			    drawFruit(ctx,W/2,28,nextLv);
			  }
			  requestAnimationFrame(loop);
			}
			loop();
		</script>
	</body>
</html>
